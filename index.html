<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Periodic Table</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="container">
    <input type="text" class="search-box" placeholder="Search elements (Name, Symbol, Number)..." />

    <!-- Periodic Table Grid -->
    <div class="periodic-table" id="periodicTable"></div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-item">
        <div class="legend-color" style="background: var(--alkali-metal)"></div>
        <span>Alkali Metal</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: var(--alkaline-earth)"></div>
        <span>Alkaline Earth</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: var(--transition-metal)"></div>
        <span>Transition Metal</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: var(--post-transition)"></div>
        <span>Post-Transition</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: var(--metalloid)"></div>
        <span>Metalloid</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: var(--nonmetal)"></div>
        <span>Nonmetal</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: var(--noble-gas)"></div>
        <span>Noble Gas</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: var(--lanthanide)"></div>
        <span>Lanthanide</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: var(--actinide)"></div>
        <span>Actinide</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: var(--unknown)"></div>
        <span>Unknown/Predicted</span>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="elementModal">
    <div class="modal-content">
      <button class="close-button" id="closeModal">&times;</button>
      <div id="elementDetails"></div>
    </div>
  </div>

  <script src="./index.js"></script>
</body>
</html>
